packages:
  - "apps/*"
  - "packages/*"
overrides:
  # M-5: qs DoS (GHSA-4mjr-xmp4-gh2g) reachable pre-auth via Nest's
  # urlencoded body parser. Force the patched version transitively.
  qs: ">=6.16.0"
  # One copy of @types/react workspace-wide: mobile (Expo SDK 57) pins 19.2.x,
  # web resolved 19.3.x, and the two conflict on Ref types.
  "@types/react": "19.2.18"
allowBuilds:
  # All five arrive with Clerk and none needs its build script to run:
  # @clerk/shared's only prints a telemetry notice, core-js's a funding
  # banner, bufferutil/utf-8-validate are optional native ws speedups.
  '@clerk/shared': false
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false

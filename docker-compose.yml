name: csc-stack

services:
  db:
    container_name: csc-db
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Web Application (Next.js)
  web:
    container_name: csc-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_Zm9vLWJhci0xMy5jbGVyay5hY2NvdW50cy5kZXYk}
        CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_mock_secret_key_for_docker_build_00000000000000000000000000}
        DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_Zm9vLWJhci0xMy5jbGVyay5hY2NvdW50cy5kZXYk}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_mock_secret_key_for_docker_build_00000000000000000000000000}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      GOVERNOR_EMAILS: ${GOVERNOR_EMAILS:-governor@gbox.ncf.edu.ph}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://attendance.ncfccs.org
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Production Deployment Notification
        run: |
          echo "🚀 Production deployment triggered for commit ${{ github.sha }} on main branch."
          echo "Vercel automatically builds and deploys production for main branch."

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy API to Heroku
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      # Heroku's build output (buildpack install, build, release) streams
      # into this step's log, so it shows live in the Actions UI.
      - name: Push to Heroku (build + release)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ vars.HEROKU_APP }}
        run: git push --force "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git" ${{ github.event.workflow_run.head_sha }}:refs/heads/main

  deploy-web:
    name: Deploy Web (Vercel)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://attendance.ncfccs.org
    steps:
      - run: echo "Vercel builds and deploys main automatically (commit ${{ github.event.workflow_run.head_sha }})."
